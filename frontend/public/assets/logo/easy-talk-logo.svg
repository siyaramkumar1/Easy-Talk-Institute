<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- Circle Logo Background -->
  <circle cx="50" cy="50" r="40" fill="url(#grad1)" />
  <!-- Text inside Circle -->
  <text x="50" y="60" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#ffffff" text-anchor="middle">ET</text>
  
  <!-- "EASY TALK" Text -->
  <text x="110" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="#1e3a8a">EASY TALK</text>
  <!-- "Institute" Text -->
  <text x="115" y="75" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f97316" letter-spacing="4">INSTITUTE</text>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
